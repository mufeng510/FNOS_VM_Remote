name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FNPACK_VERSION: 1.2.3
  FNPACK_SHA256: 54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93

jobs:
  test:
    name: Go 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: gofmt 检查
        working-directory: backend
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未通过 gofmt："
            echo "$files"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: 单元测试
        working-directory: backend
        run: go test ./... -count=1

      - name: 编译检查（linux/amd64）
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/vmhelper

  fpk:
    name: FPK 构建与包结构检查
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: 下载并校验 fnpack
        run: |
          curl -fsSL "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64" -o /tmp/fnpack
          echo "${FNPACK_SHA256}  /tmp/fnpack" | sha256sum -c -
          chmod +x /tmp/fnpack
          /tmp/fnpack --help >/dev/null

      - name: 构建 FPK
        env:
          FNPACK: /tmp/fnpack
        run: ./scripts/build-fpk.sh dist

      - name: 校验 FPK 结构与版本
        run: |
          VERSION="$(grep -E '^version' fnos-app/manifest | head -n1 | awk -F= '{gsub(/[ \t]/,"",$2); print $2}')"
          echo "manifest version: ${VERSION}"
          ./scripts/check-fpk.sh "dist/fnos-vm-remote-v${VERSION}.fpk" "${VERSION}"

      - name: 上传 FPK 构建产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fnos-vm-remote-fpk-${{ github.sha }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 30
